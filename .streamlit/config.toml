[server]
port = 8517
address = "127.0.0.1"
headless = true
# Keep CORS/XSRF compatible (Streamlit overrides enableCORS=false when XSRF is on)
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#018BFF"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF1F6"
textColor = "#1B1F24"
